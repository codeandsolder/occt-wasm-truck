[workspace]
members = ["xtask", "crate"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andymai/occt-wasm"
rust-version = "1.95"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
nursery = { level = "warn", priority = -1 }
panic = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"


# LLVM cannot see the embedded kernel or other compile-time non-Rust inputs.
# Explicit input rules ensure a changed kernel selects the integration scope.
[[workspace.metadata.affected.rule]]
globs = ["crate/src/occt-wasm.wasm.br"]
filterset = "package(occt-wasm)"

[[workspace.metadata.affected.rule]]
globs = ["crate/README.md"]
filterset = "package(occt-wasm)"
