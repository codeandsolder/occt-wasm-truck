name: Validate Renovate configuration

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  renovate-config:
    uses: codeandsolder/ci-workflows/.github/workflows/renovate-config.yml@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
