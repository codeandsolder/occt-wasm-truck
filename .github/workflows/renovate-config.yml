name: Validate Renovate configuration

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  renovate-config:
    uses: codeandsolder/ci-workflows/.github/workflows/renovate-config.yml@4dc75c98d3f12d3b5417e1cf9656e5f239a53c35 # main
