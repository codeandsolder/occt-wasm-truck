name: Track upstream

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
    with:
      upstream-repository: andymai/occt-wasm
      upstream-branch: main
      target-branch: main
      workflow-policy: preserve
      upstream-release-prefix: crate-v
      generation-container: ghcr.io/andymai/occt-wasm-builder@sha256:8ef7042f3dcf88ae4cda139e0988624c811d5d3f859c8e8a7c325bbf3c9c7d49
      generation-script: .github/scripts/generate-upstream.sh
      generated-files: >-
        facade/generated/bindings.cpp
        facade/generated/kernel.cpp
        crate/src/kernel_generated.rs
        crate/src/occt-wasm.wasm.br
      validation-script: .github/scripts/validate-upstream.sh
      timeout-minutes: 120
      rust-toolchain: repository
