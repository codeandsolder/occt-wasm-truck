name: Build WASM

on:
  workflow_call:
    inputs:
      release:
        description: Build in release mode (LTO + wasm-opt)
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: Name of the uploaded dist artifact
        value: occt-wasm-dist

jobs:
  build:
    name: WASM Build & Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andymai/occt-wasm-builder@sha256:8ef7042f3dcf88ae4cda139e0988624c811d5d3f859c8e8a7c325bbf3c9c7d49
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Link pre-built OCCT libs
        run: |
          cp -r /workspace/occt/build occt/build
          cp -r /workspace/3rdparty 3rdparty

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ts/package-lock.json

      - name: Resolve fleet compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@4dc75c98d3f12d3b5417e1cf9656e5f239a53c35 # main

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Trust checked-out workspace inside builder container
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup canonical sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@4dc75c98d3f12d3b5417e1cf9656e5f239a53c35 # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Install dependencies
        run: |
          npm ci
          cd ts && npm ci

      - name: Build facade + link WASM
        run: cargo xtask build ${{ inputs.release && '--release' || '' }}

      - name: Build TypeScript
        run: |
          cd ts
          npm run build
          cp ../dist/occt-wasm.js ../dist/occt-wasm.wasm dist/

      - name: Run tests
        run: npx vitest run

      # The suite loads dist/occt-wasm.js directly, so OcctKernel.init()'s
      # dynamic import is only covered here. #271 shipped without it.
      - name: Bundler smoke test
        run: npm run test:bundler

      # The demos are the documentation people actually copy from, and they
      # used to fail silently — a try/catch rendered an unfilleted shape and
      # nothing complained. Non-zero exit is the gate.
      - name: Run node examples
        shell: bash
        run: |
          for example in examples/node-cli/*.mjs; do
            echo "::group::$example"
            node "$example"
            echo "::endgroup::"
          done

      - name: Run benchmarks & check for regressions
        if: ${{ !inputs.release }}
        shell: bash
        run: |
          npx vitest run test/bench.test.ts
          node scripts/bench-check.js

      # Refreshing benchmarks/baseline.json requires numbers measured on runner
      # hardware, so the results have to leave the runner. Uploaded even when the
      # gate fails, since that is exactly when the numbers are worth reading.
      - name: Upload benchmark results
        if: ${{ !cancelled() && !inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmarks/last-run.json
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: occt-wasm-dist
          path: ts/dist/
          retention-days: 7

      - name: Finalize canonical sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@4dc75c98d3f12d3b5417e1cf9656e5f239a53c35 # main
