name: Crate tests

# Runs the crate's integration suite against the committed WASI blob through
# wasmtime. The npm tests exercise a different artifact (Embind), so this is
# the only check on the C-ABI path crates.io users get. Release mode, because
# debug wasmtime compiles the module ~100x slower and the suite skips there.

on:
  pull_request:
    paths:
      - crate/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .github/workflows/crate-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crate-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Crate integration tests (release)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5cfc1a720a1499c3c2cfe733ef235a6953f9ad3e # draft unified CI; repin after upstream acceptance
    with:
      command: ":"
      test-suites: |
        [{
          "name": "occt-release",
          "cargo": ["--locked", "--release", "-p", "occt-wasm", "--lib", "--tests"],
          "nextest": ["--test-threads", "4"],
          "doctests": ["--locked", "--release", "-p", "occt-wasm"]
        }]
