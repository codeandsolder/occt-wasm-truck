name: Crate tests

# Runs the crate's integration suite against the committed WASI blob through
# wasmtime. The npm tests exercise a different artifact (Embind), so this is
# the only check on the C-ABI path crates.io users get. Release mode, because
# debug wasmtime compiles the module ~100x slower and the suite skips there.

on:
  pull_request:
    paths:
      - crate/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .github/workflows/crate-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crate-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Crate integration tests (release)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@8ab6060d47a3c56bb406aff41189fbfcf7aa9acc # main
    with:
      command: |
        cargo test --locked --release -p occt-wasm --lib --tests -- --test-threads=4
        cargo test --locked --release -p occt-wasm --doc
