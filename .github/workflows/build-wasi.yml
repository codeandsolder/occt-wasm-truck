name: Build WASI

# Refreshes the embedded `crate/src/occt-wasm.wasm.br` shipped to crates.io and
# fails when the committed bytes drift from what the current sources produce.
#
# Uses the existing `ghcr.io/andymai/occt-wasm-builder` image — same emcc
# toolchain + pre-built OCCT static libs as the npm build. xtask::build_wasi
# compiles the C-ABI facade and links with `em++ -sSTANDALONE_WASM=1`, so the
# only thing this workflow does on top is run the build, brotli, and diff.

on:
  pull_request:
    paths:
      - facade/**
      - xtask/src/**
      - 3rdparty/**
      - crate/src/occt-wasm.wasm.br
      - .gitmodules
      - occt
      - .github/workflows/build-wasi.yml
      - .github/scripts/generate-upstream.sh
      - Dockerfile.builder
      - scripts/fetch-rapidjson.sh
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
  push:
    branches: [main]
    paths:
      - facade/**
      - xtask/src/**
      - 3rdparty/**
      - crate/src/occt-wasm.wasm.br
      - .gitmodules
      - occt
      - .github/workflows/build-wasi.yml
      - .github/scripts/generate-upstream.sh
      - Dockerfile.builder
      - scripts/fetch-rapidjson.sh
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-wasi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: WASI build + stale-check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andymai/occt-wasm-builder@sha256:8ef7042f3dcf88ae4cda139e0988624c811d5d3f859c8e8a7c325bbf3c9c7d49
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Resolve fleet compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@8ab6060d47a3c56bb406aff41189fbfcf7aa9acc # main

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rustfmt

      - name: Trust checked-out workspace inside builder container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup canonical sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@8ab6060d47a3c56bb406aff41189fbfcf7aa9acc # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}

      - name: Snapshot committed crate WASM
        # Snapshot before the build overwrites the file. cmp works without
        # needing a usable .git inside the container.
        run: cp crate/src/occt-wasm.wasm.br /tmp/committed.wasm.br

      - name: Build WASI WASM + brotli install
        run: |
          bash .github/scripts/generate-upstream.sh

      - name: Stale-check vs. committed crate WASM
        id: stale
        shell: bash
        run: |
          set -euo pipefail
          new_size=$(stat -c%s crate/src/occt-wasm.wasm.br)
          if cmp -s /tmp/committed.wasm.br crate/src/occt-wasm.wasm.br &&
             git diff --quiet -- facade/generated/ crate/src/kernel_generated.rs crate/tests/validation_bindings.rs; then
            echo "crate/src/occt-wasm.wasm.br is up to date ($new_size bytes)."
          else
            echo "::error file=crate/src/occt-wasm.wasm.br::Committed bytes diverge from the rebuild. Regenerate locally with: cargo xtask build-wasi --release && git add crate/src/occt-wasm.wasm.br. The fresh artifact is uploaded to this run."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload fresh .wasm.br when stale
        if: steps.stale.outputs.stale == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: occt-wasm-rebuilt
          path: |
            crate/src/occt-wasm.wasm.br
            crate/src/kernel_generated.rs
            facade/generated/bindings.cpp
            facade/generated/kernel.cpp
            crate/tests/validation_bindings.rs
          retention-days: 14

      - name: Test rebuilt kernel
        run: cargo test --locked --release -p occt-wasm --test validation_bindings

      - name: Fail when stale
        if: steps.stale.outputs.stale == 'true'
        run: exit 1

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@8ab6060d47a3c56bb406aff41189fbfcf7aa9acc # main
