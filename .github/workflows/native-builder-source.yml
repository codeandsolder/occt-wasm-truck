name: Native OCCT builder source provenance

on:
  pull_request:
    paths:
      - occt
      - .gitmodules
      - patches/occt/**
      - Dockerfile.builder
      - .dockerignore
      - .github/scripts/generate-upstream.sh
      - .github/workflows/native-builder-source.yml
  push:
    branches: [main]
    paths:
      - occt
      - .gitmodules
      - patches/occt/**
      - Dockerfile.builder
      - .dockerignore
      - .github/scripts/generate-upstream.sh
      - .github/workflows/native-builder-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  patch-provenance:
    name: Reproduce reviewed OCCT source overlays
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Apply native overlays to exactly the pinned OCCT gitlink
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat patches/occt/gitlink)
          actual=$(git rev-parse HEAD:occt)
          test "$actual" = "$expected"
          (
            cd occt
            git apply --check ../patches/occt/*.patch
            git apply ../patches/occt/*.patch
            sha256sum --check ../patches/occt/source.sha256
          )
