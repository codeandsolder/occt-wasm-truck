name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ts/package-lock.json

      - name: Install TS dependencies
        run: cd ts && npm ci

      # tsconfig.test.json resolves @types/node from the root install.
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript typecheck
        run: cd ts && npx tsgo --noEmit

      - name: TypeScript typecheck (tests)
        run: npm run typecheck:tests

      - name: Documented snippets compile
        run: npm run typecheck:docs

      - name: ESLint
        run: cd ts && npx eslint src/

  native-mesh-results:
    name: Native mesh result ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test move ownership and checked counts under sanitizers
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I facade/include facade/tests/mesh_results.cpp -o "$RUNNER_TEMP/mesh-results-test"
          "$RUNNER_TEMP/mesh-results-test"

  codegen:
    name: Generated-code consistency
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
    with:
      rust-components: rustfmt
      command: |
        cargo test --locked -p xtask
        cargo xtask codegen
        cargo fmt --all
        git diff --exit-code -- facade/generated/ crate/src/kernel_generated.rs
        test -z "$(git ls-files --others --exclude-standard facade/generated/)"

  build-test:
    uses: ./.github/workflows/build-wasm.yml

  browser-smoke:
    name: Browser Smoke Test
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: occt-wasm-dist
          path: dist/

      - name: Copy WASM to ts/dist for test imports
        run: mkdir -p ts/dist && cp dist/occt-wasm.js dist/occt-wasm.wasm ts/dist/

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium firefox --with-deps

      # Firefox exposes WebGL only against a real display, so the demo specs
      # need one; Mesa's llvmpipe supplies the driver behind it. Chromium is
      # unaffected — it falls back to SwiftShader either way.
      - name: Install virtual display + software GL
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      # xvfb-run sets DISPLAY, which flips the Firefox project to headed
      # (playwright.config.ts). Without it the demo specs fail rather than skip,
      # so a broken display setup cannot quietly cost us the coverage.
      - name: Run browser smoke test
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npx playwright test
